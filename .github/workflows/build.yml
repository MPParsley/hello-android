name: Build Multiplatform

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            androidApp/build/outputs/apk/release/*.apk

  build-ios-framework:
    name: Build iOS Shared Framework
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build iOS Shared Framework (Simulator - x64)
        run: ./gradlew :shared:linkReleaseFrameworkIosX64

      - name: Build iOS Shared Framework (Simulator - arm64)
        run: ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64

      - name: Build iOS Shared Framework (Device - arm64)
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Upload iOS Frameworks
        uses: actions/upload-artifact@v4
        with:
          name: ios-frameworks
          path: shared/build/bin/ios*/releaseFramework/

  build-ios-app:
    name: Build iOS App
    runs-on: macos-latest
    needs: []

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shared framework for iOS Simulator
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Build iOS App (Simulator)
        run: |
          cd iosApp
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath build \
            FRAMEWORK_SEARCH_PATHS="../shared/build/bin/iosSimulatorArm64/debugFramework" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: iosApp/build/Build/Products/Debug-iphonesimulator/*.app
