name: Build Multiplatform

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Build Android Release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            androidApp/build/outputs/apk/release/*.apk

  build-ios-framework:
    name: Build iOS Shared Framework
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build iOS Shared Framework (Simulator - x64)
        run: ./gradlew :shared:linkReleaseFrameworkIosX64

      - name: Build iOS Shared Framework (Simulator - arm64)
        run: ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64

      - name: Build iOS Shared Framework (Device - arm64)
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Upload iOS Frameworks
        uses: actions/upload-artifact@v4
        with:
          name: ios-frameworks
          path: shared/build/bin/ios*/releaseFramework/

  build-ios-app:
    name: Build iOS App
    runs-on: macos-latest
    needs: []

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shared framework for iOS Simulator
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Find iOS Simulator destination
        id: simulator
        run: |
          # Get the latest available iPhone simulator runtime and device
          RUNTIME=$(xcrun simctl list runtimes iOS available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['runtimes']
          if runtimes:
              print(runtimes[-1]['identifier'])
          ")
          DEVICE_ID=$(xcrun simctl list devices iPhone available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices.keys(), reverse=True):
              if devices[runtime]:
                  print(devices[runtime][0]['udid'])
                  break
          ")
          if [ -n "$DEVICE_ID" ]; then
            echo "destination=platform=iOS Simulator,id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No iOS Simulator device found"
            exit 1
          fi

      - name: Build iOS App (Simulator)
        run: |
          cd iosApp
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath build \
            FRAMEWORK_SEARCH_PATHS="../shared/build/bin/iosSimulatorArm64/debugFramework" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Find iOS App bundle
        id: app-path
        run: |
          APP=$(find iosApp/build/Build/Products -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No .app bundle found in build products"
            find iosApp/build -type d -maxdepth 5 || true
            exit 1
          fi
          echo "Found app at: $APP"
          echo "path=$APP" >> "$GITHUB_OUTPUT"

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ${{ steps.app-path.outputs.path }}

  build-ios-device:
    name: Build iOS Device IPA
    runs-on: macos-latest
    if: >
      github.event_name == 'push' &&
      vars.IOS_SIGNING_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shared framework for iOS device
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Install Apple certificate and provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          # Decode certificate and provisioning profile
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< \
            "$(/usr/bin/security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Resolve export options
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.example.hellomultiplatform.ios' }}
        run: |
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< \
            "$(/usr/bin/security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision)")

          sed -e "s/\$(TEAM_ID)/$TEAM_ID/g" \
              -e "s/\$(BUNDLE_ID)/$BUNDLE_ID/g" \
              -e "s/\$(PROVISIONING_PROFILE_NAME)/$PROFILE_NAME/g" \
              iosApp/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive iOS app
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cd iosApp
          xcodebuild archive \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            FRAMEWORK_SEARCH_PATHS="../shared/build/bin/iosArm64/releaseFramework" \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/iosApp.xcarchive \
            -exportPath $RUNNER_TEMP/ipa-output \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-ipa
          path: ${{ runner.temp }}/ipa-output/*.ipa

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
